<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Mirai Engineering AI delivery process</title>
  <desc id="desc">A three-step diagram showing discovery, custom AI development, and production deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#251342"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="700" rx="30" fill="url(#bg)"/>
  <circle cx="1050" cy="70" r="190" fill="#7c3aed" opacity=".09"/><circle cx="80" cy="670" r="230" fill="#0ea5e9" opacity=".07"/>
  <text x="70" y="82" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">FROM BUSINESS NEED TO WORKING AI</text>
  <text x="70" y="132" fill="white" font-family="Arial, sans-serif" font-size="34" font-weight="700">One engineering partner. The complete delivery path.</text>
  <path d="M315 348H442M758 348H885" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="m423 330 20 18-20 18M866 330l20 18-20 18" fill="none" stroke="#7dd3fc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="58" y="206" width="270" height="306" rx="24" fill="#fff"/>
    <circle cx="193" cy="282" r="48" fill="#ede9fe"/><path d="M169 283h48M193 259v48" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/><circle cx="193" cy="283" r="27" fill="none" stroke="#7c3aed" stroke-width="6"/>
    <text x="193" y="367" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="700">01 · DISCOVER</text>
    <text x="193" y="409" text-anchor="middle" fill="#4b5563" font-family="Arial, sans-serif" font-size="20">Find the valuable use case</text>
    <rect x="98" y="448" width="190" height="38" rx="19" fill="#f3f4f6"/><text x="193" y="474" text-anchor="middle" fill="#6d28d9" font-family="Arial, sans-serif" font-size="17" font-weight="700">AI CONSULTANCY</text>
    <rect x="465" y="178" width="294" height="362" rx="24" fill="#fff"/>
    <circle cx="612" cy="269" r="54" fill="#e0f2fe"/><path d="m582 282 23-27 20 17 25-31" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="582" cy="282" r="7" fill="#7c3aed"/><circle cx="605" cy="255" r="7" fill="#7c3aed"/><circle cx="625" cy="272" r="7" fill="#7c3aed"/><circle cx="650" cy="241" r="7" fill="#7c3aed"/>
    <text x="612" y="369" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="700">02 · BUILD</text>
    <text x="612" y="411" text-anchor="middle" fill="#4b5563" font-family="Arial, sans-serif" font-size="20">Engineer around your data</text>
    <rect x="499" y="450" width="226" height="38" rx="19" fill="#f3f4f6"/><text x="612" y="476" text-anchor="middle" fill="#0369a1" font-family="Arial, sans-serif" font-size="17" font-weight="700">CUSTOM AI SYSTEMS</text>
    <rect x="885" y="206" width="257" height="306" rx="24" fill="#fff"/>
    <circle cx="1014" cy="282" r="48" fill="#dcfce7"/><path d="M982 291h64M993 291v20h42v-20M1001 267h26l13 24h-52z" fill="none" stroke="#16a34a" stroke-width="7" stroke-linejoin="round"/>
    <text x="1014" y="367" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="700">03 · DEPLOY</text>
    <text x="1014" y="409" text-anchor="middle" fill="#4b5563" font-family="Arial, sans-serif" font-size="20">Put AI into real workflows</text>
    <rect x="922" y="448" width="184" height="38" rx="19" fill="#f3f4f6"/><text x="1014" y="474" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="17" font-weight="700">PRODUCTION READY</text>
  </g>
</svg>
